<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Flowing Chromatics — Artivist</title>
  <desc>Generative art exploring color flow and chromatic waves</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>

    <linearGradient id="flow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b">
        <animate attributeName="stop-color" values="#ff6b6b;#feca57;#48dbfb;#ff9ff3;#ff6b6b" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#feca57">
        <animate attributeName="stop-color" values="#feca57;#48dbfb;#ff9ff3;#ff6b6b;#feca57" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#48dbfb">
        <animate attributeName="stop-color" values="#48dbfb;#ff9ff3;#ff6b6b;#feca57;#48dbfb" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="flow2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9ff3">
        <animate attributeName="stop-color" values="#ff9ff3;#ff6b6b;#feca57;#48dbfb;#ff9ff3" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#48dbfb">
        <animate attributeName="stop-color" values="#48dbfb;#ff9ff3;#ff6b6b;#feca57;#48dbfb" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8"/>
      <stop offset="40%" style="stop-color:#feca57;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg-grad)"/>

  <!-- Flowing waves -->
  <g opacity="0.7">
    <path d="M0,280 Q50,200 100,280 Q150,360 200,280 Q250,200 300,280 Q350,360 400,280 L400,400 L0,400 Z"
          fill="url(#flow1)" filter="url(#glow)">
      <animate attributeName="d"
               values="M0,280 Q50,200 100,280 Q150,360 200,280 Q250,200 300,280 Q350,360 400,280 L400,400 L0,400 Z;
                       M0,260 Q50,320 100,260 Q150,180 200,260 Q250,340 300,260 Q350,180 400,260 L400,400 L0,400 Z;
                       M0,280 Q50,200 100,280 Q150,360 200,280 Q250,200 300,280 Q350,360 400,280 L400,400 L0,400 Z"
               dur="10s" repeatCount="indefinite"/>
    </path>

    <path d="M0,320 Q60,260 120,320 Q180,380 240,320 Q300,260 360,320 Q400,290 400,320 L400,400 L0,400 Z"
          fill="url(#flow2)" opacity="0.6" filter="url(#glow)">
      <animate attributeName="d"
               values="M0,320 Q60,260 120,320 Q180,380 240,320 Q300,260 360,320 Q400,290 400,320 L400,400 L0,400 Z;
                       M0,340 Q60,280 120,340 Q180,400 240,340 Q300,280 360,340 Q400,310 400,340 L400,400 L0,400 Z;
                       M0,320 Q60,260 120,320 Q180,380 240,320 Q300,260 360,320 Q400,290 400,320 L400,400 L0,400 Z"
               dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Central glow -->
  <circle cx="200" cy="200" r="100" fill="url(#glow-center)">
    <animate attributeName="r" values="100;120;100" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating particles -->
  <g filter="url(#glow)">
    <circle cx="80" cy="120" r="4" fill="#ff6b6b">
      <animate attributeName="cy" values="120;100;120" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="100" r="3" fill="#feca57">
      <animate attributeName="cy" values="100;130;100" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="300" r="5" fill="#48dbfb">
      <animate attributeName="cy" values="300;270;300" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="320" r="3" fill="#ff9ff3">
      <animate attributeName="cy" values="320;290;320" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="250" r="4" fill="#feca57">
      <animate attributeName="cy" values="250;280;250" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="240" r="4" fill="#ff6b6b">
      <animate attributeName="cy" values="240;210;240" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Connecting lines between particles -->
  <g stroke="#ffffff" stroke-width="0.3" opacity="0.3">
    <line x1="80" y1="120" x2="150" y2="300">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="320" y1="100" x2="260" y2="320">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="300" x2="260" y2="320">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="250" x2="80" y2="120">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Spiral overlay -->
  <path d="M200,200 Q230,170 200,140 Q170,170 200,200 Q230,230 200,260 Q170,230 200,200 Q230,170 200,140 Q170,170 200,110 Q240,150 200,200 Q160,250 200,290 Q240,250 200,200"
        fill="none" stroke="#ff9ff3" stroke-width="1" opacity="0.5" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite"/>
  </path>
</svg>