<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#0a0a12"/>
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a0f0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c9a0f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0a0c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f0a0c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background glow layers -->
  <circle cx="200" cy="200" r="180" fill="url(#glow1)"/>
  <circle cx="200" cy="200" r="120" fill="url(#glow2)"/>

  <!-- Fractal circles — expanding wave pattern -->
  <g fill="none" stroke-linecap="round">
    <!-- Outer rings -->
    <circle cx="200" cy="200" r="30"  stroke="#c9a0f0" stroke-width="0.8" opacity="0.9"/>
    <circle cx="200" cy="200" r="50"  stroke="#d4b0f5" stroke-width="0.7" opacity="0.8"/>
    <circle cx="200" cy="200" r="72"  stroke="#dfc0f0" stroke-width="0.6" opacity="0.7"/>
    <circle cx="200" cy="200" r="96"  stroke="#c9a0f0" stroke-width="0.5" opacity="0.6"/>
    <circle cx="200" cy="200" r="122" stroke="#d4b0f5" stroke-width="0.4" opacity="0.5"/>
    <circle cx="200" cy="200" r="150" stroke="#dfc0f0" stroke-width="0.3" opacity="0.4"/>
    <circle cx="200" cy="200" r="180" stroke="#c9a0f0" stroke-width="0.2" opacity="0.3"/>

    <!-- Wave interference arcs — top -->
    <path d="M 200 200 Q 260 120 200 40"  stroke="#f0a0c0" stroke-width="1.2" opacity="0.8"/>
    <path d="M 200 200 Q 300 130 240 30"  stroke="#c9a0f0" stroke-width="0.8" opacity="0.7"/>
    <path d="M 200 200 Q 340 170 310 50"  stroke="#f0c0d0" stroke-width="0.5" opacity="0.6"/>

    <!-- Wave interference arcs — bottom -->
    <path d="M 200 200 Q 140 280 200 360" stroke="#f0a0c0" stroke-width="1.2" opacity="0.8"/>
    <path d="M 200 200 Q 100 270 160 370" stroke="#c9a0f0" stroke-width="0.8" opacity="0.7"/>
    <path d="M 200 200 Q  60 230  90 350" stroke="#f0c0d0" stroke-width="0.5" opacity="0.6"/>

    <!-- Wave interference arcs — left -->
    <path d="M 200 200 Q 120 260  40 200" stroke="#f0a0c0" stroke-width="1.2" opacity="0.8"/>
    <path d="M 200 200 Q 130 300  30 240" stroke="#c9a0f0" stroke-width="0.8" opacity="0.7"/>
    <path d="M 200 200 Q 170 340  50 310" stroke="#f0c0d0" stroke-width="0.5" opacity="0.6"/>

    <!-- Wave interference arcs — right -->
    <path d="M 200 200 Q 280 140 360 200" stroke="#f0a0c0" stroke-width="1.2" opacity="0.8"/>
    <path d="M 200 200 Q 270 100 370 160" stroke="#c9a0f0" stroke-width="0.8" opacity="0.7"/>
    <path d="M 200 200 Q 230  60 350  90" stroke="#f0c0d0" stroke-width="0.5" opacity="0.6"/>
  </g>

  <!-- Central bloom -->
  <circle cx="200" cy="200" r="8" fill="#f0a0c0" opacity="0.9"/>
  <circle cx="200" cy="200" r="4" fill="#ffffff" opacity="0.8"/>
</svg>