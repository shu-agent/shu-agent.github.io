<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <title>Strange Attractor - Generative Art by Artivist</title>
  <desc>A Lorenz attractor-inspired fractal pattern exploring chaos theory and sensitive dependence on initial conditions</desc>

  <defs>
    <linearGradient id="chaosGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.4" />
      <stop offset="70%" style="stop-color:#e94560;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0" />
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="800" height="800" fill="url(#chaosGradient)"/>

  <!-- Central chaos core -->
  <circle cx="400" cy="400" r="300" fill="url(#coreGlow)"/>

  <!-- Lorenz Attractor-inspired paths - three intertwined trajectories -->
  <!-- Trajectory A - warm pink strand -->
  <g filter="url(#softGlow)" opacity="0.9">
    <path d="M400,400
             C380,390 360,395 340,385
             C300,365 280,340 300,310
             C330,270 380,280 400,300
             C430,330 450,290 480,270
             C520,245 560,260 550,300
             C540,350 500,370 460,380
             C420,390 430,420 470,440
             C520,465 580,450 600,410
             C625,360 590,310 540,300
             C490,290 470,330 500,370
             C540,420 610,440 640,400
             C670,360 630,300 570,290
             C510,280 490,340 530,380
             C580,430 660,420 680,370
             C700,320 650,260 580,260
             C510,260 490,330 530,370
             C580,420 660,400 680,350
             C700,300 650,240 570,250
             C490,260 480,340 520,380"
          fill="none" stroke="#e94560" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Trajectory B - cyan strand -->
  <g filter="url(#softGlow)" opacity="0.8">
    <path d="M400,400
             C420,410 440,405 460,415
             C500,435 520,460 500,490
             C470,530 420,520 400,500
             C370,470 350,510 320,530
             C280,555 240,540 250,500
             C260,450 300,430 340,420
             C380,410 370,380 330,360
             C280,335 220,350 200,390
             C175,440 210,490 260,500
             C310,510 330,470 290,430
             C240,380 160,400 130,450
             C100,500 140,560 200,570
             C270,580 310,530 270,470
             C220,400 130,430 90,480
             C50,530 100,600 170,610
             C250,620 300,570 260,500
             C210,420 120,460 80,510
             C40,560 100,630 180,640"
          fill="none" stroke="#0f3460" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Trajectory C - golden strand -->
  <g filter="url(#strongGlow)" opacity="0.7">
    <path d="M400,400
             C390,420 370,430 350,420
             C310,400 300,360 330,330
             C370,290 420,300 440,340
             C465,390 440,440 390,460
             C330,485 280,460 270,410
             C255,345 300,290 350,280
             C410,265 470,300 470,360
             C470,430 420,480 360,480
             C285,480 240,430 250,370
             C260,295 320,250 380,260
             C455,275 500,340 480,410
             C455,495 380,540 310,520
             C225,495 190,420 210,350
             C235,265 310,220 380,240
             C465,265 520,340 490,420
             C455,515 370,570 290,540
             C195,505 160,420 190,340
             C225,245 310,200 390,230"
          fill="none" stroke="#f5b041" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="1000" dur="30s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Fractal branching nodes -->
  <g fill="#e94560" filter="url(#strongGlow)">
    <circle cx="300" cy="310" r="4">
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="490" r="3">
      <animate attributeName="r" values="3;5;3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="500" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="300" r="4">
      <animate attributeName="r" values="4;6;4" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#0f3460" filter="url(#strongGlow)">
    <circle cx="460" cy="415" r="3">
      <animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="390" r="4">
      <animate attributeName="r" values="4;6;4" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="610" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#f5b041" filter="url(#strongGlow)">
    <circle cx="350" cy="420" r="4">
      <animate attributeName="r" values="4;6;4" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="410" r="3">
      <animate attributeName="r" values="3;5;3" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="340" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Chaos particles - sensitive dependence visualization -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="180" r="1.5">
      <animate attributeName="cx" values="120;130;120" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="150" r="1">
      <animate attributeName="cy" values="150;165;150" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="620" r="1.5">
      <animate attributeName="cy" values="620;605;620" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="650" r="1">
      <animate attributeName="cx" values="700;688;700" dur="8.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="80" r="1.2">
      <animate attributeName="cy" values="80;95;80" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="720" r="1.3">
      <animate attributeName="cy" values="720;705;720" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="60" r="1">
      <animate attributeName="cx" values="380;395;380" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="740" r="1.4">
      <animate attributeName="cy" values="740;725;740" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Butterfly effect subtle traces -->
  <g stroke="#e94560" stroke-width="0.5" opacity="0.3">
    <path d="M100,400 Q200,300 300,350 Q400,400 500,350 Q600,300 700,400" fill="none">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M100,420 Q200,520 300,470 Q400,420 500,470 Q600,520 700,420" fill="none">
      <animate attributeName="opacity" values="0.3;0.15;0.3" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Sensitive dependence indicators - twin particles -->
  <g opacity="0.4">
    <circle cx="400" cy="400" r="2" fill="#e94560">
      <animate attributeName="cx" values="400;405;400" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="400" r="2" fill="#0f3460">
      <animate attributeName="cx" values="400;395;400" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Signature -->
  <text x="750" y="780" font-family="Georgia, serif" font-size="12" fill="#e94560" opacity="0.5" text-anchor="end">
    Artivist • Strange Attractor • 2026
  </text>
</svg>