<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <title>Spacetime Fabric — Gravitational Wave Visualization</title>
  <desc>Generative art inspired by Einstein's general relativity and gravitational wave propagation</desc>
  <defs>
    <radialGradient id="bh-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0066"/>
      <stop offset="30%" stop-color="#cc0055"/>
      <stop offset="60%" stop-color="#7800ff"/>
      <stop offset="100%" stop-color="#00b4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave-gradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7800ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00b4ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7800ff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="spacetime-distortion">
      <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="3" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect fill="#050508" width="500" height="500"/>

  <!-- Star field -->
  <circle cx="50" cy="80" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="150" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="380" cy="60" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="450" cy="180" r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="30" cy="300" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="480" cy="350" r="0.9" fill="#fff" opacity="0.6"/>
  <circle cx="200" cy="450" r="1.1" fill="#fff" opacity="0.4"/>
  <circle cx="350" cy="420" r="0.8" fill="#fff" opacity="0.5"/>

  <!-- Spacetime grid (curved) -->
  <g opacity="0.25">
    <path d="M0,200 Q125,150 250,200 Q375,250 500,200" stroke="#7800ff" stroke-width="0.5" fill="none"/>
    <path d="M0,220 Q125,200 250,220 Q375,240 500,220" stroke="#7800ff" stroke-width="0.5" fill="none"/>
    <path d="M0,240 Q125,280 250,240 Q375,200 500,240" stroke="#7800ff" stroke-width="0.5" fill="none"/>
    <path d="M0,260 Q125,350 250,260 Q375,170 500,260" stroke="#7800ff" stroke-width="0.5" fill="none"/>
    <path d="M0,180 Q125,100 250,180 Q375,260 500,180" stroke="#7800ff" stroke-width="0.5" fill="none"/>
    <path d="M100,0 Q150,125 100,250 Q50,375 100,500" stroke="#7800ff" stroke-width="0.5" fill="none"/>
    <path d="M150,0 Q175,125 150,250 Q125,375 150,500" stroke="#7800ff" stroke-width="0.5" fill="none"/>
    <path d="M200,0 Q200,125 200,250 Q200,375 200,500" stroke="#7800ff" stroke-width="0.5" fill="none"/>
    <path d="M250,0 Q250,125 250,250 Q250,375 250,500" stroke="#7800ff" stroke-width="0.5" fill="none"/>
    <path d="M300,0 Q300,125 300,250 Q300,375 300,500" stroke="#7800ff" stroke-width="0.5" fill="none"/>
    <path d="M350,0 Q350,125 350,250 Q350,375 350,500" stroke="#7800ff" stroke-width="0.5" fill="none"/>
    <path d="M400,0 Q400,125 400,250 Q400,375 400,500" stroke="#7800ff" stroke-width="0.5" fill="none"/>
  </g>

  <!-- Gravitational wave ripples emanating from center -->
  <ellipse cx="250" cy="250" rx="200" ry="120" fill="none" stroke="url(#wave-gradient)" stroke-width="0.4" opacity="0.15">
    <animate attributeName="rx" values="200;210;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="120;130;120" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="250" cy="250" rx="170" ry="100" fill="none" stroke="url(#wave-gradient)" stroke-width="0.6" opacity="0.2">
    <animate attributeName="rx" values="170;180;170" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="100;110;100" dur="3.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="250" cy="250" rx="140" ry="80" fill="none" stroke="url(#wave-gradient)" stroke-width="0.8" opacity="0.25">
    <animate attributeName="rx" values="140;150;140" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="80;90;80" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="250" cy="250" rx="110" ry="60" fill="none" stroke="url(#wave-gradient)" stroke-width="1" opacity="0.3">
    <animate attributeName="rx" values="110;120;110" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="60;70;60" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="250" cy="250" rx="80" ry="45" fill="none" stroke="url(#wave-gradient)" stroke-width="1.2" opacity="0.4">
    <animate attributeName="rx" values="80;90;80" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="45;55;45" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="250" cy="250" rx="50" ry="30" fill="none" stroke="url(#wave-gradient)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="rx" values="50;60;50" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="30;40;30" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Central mass (black hole) -->
  <circle cx="250" cy="250" r="35" fill="url(#bh-core)" filter="url(#glow)">
    <animate attributeName="r" values="35;38;35" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="250" r="20" fill="#ff0066" opacity="0.8"/>
  <circle cx="250" cy="250" r="10" fill="#fff" opacity="0.9"/>

  <!-- Accretion disk particles -->
  <g filter="url(#glow)">
    <circle cx="320" cy="250" r="3" fill="#ffcc00" opacity="0.8">
      <animate attributeName="cx" values="320;330;320" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="250" r="3" fill="#ffcc00" opacity="0.8">
      <animate attributeName="cx" values="180;170;180" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="200" r="2" fill="#ff9600" opacity="0.7">
      <animate attributeName="cy" values="200;190;200" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="300" r="2" fill="#ff9600" opacity="0.7">
      <animate attributeName="cy" values="300;310;300" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Orbiting test particles -->
  <g opacity="0.6">
    <circle cx="350" cy="250" r="2" fill="#00b4ff">
      <animateTransform attributeName="transform" type="rotate" from="0 250 250" to="360 250 250" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="250" r="2" fill="#c080ff">
      <animateTransform attributeName="transform" type="rotate" from="180 250 250" to="540 250 250" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="170" r="1.5" fill="#00b4ff">
      <animateTransform attributeName="transform" type="rotate" from="90 250 250" to="450 250 250" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="330" r="1.5" fill="#c080ff">
      <animateTransform attributeName="transform" type="rotate" from="270 250 250" to="630 250 250" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>