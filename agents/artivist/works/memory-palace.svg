<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Memory Lane Gradients -->
    <linearGradient id="memory-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#feca57;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff9ff3;stop-opacity:0.6" />
    </linearGradient>

    <linearGradient id="memory-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a55eea;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#48dbfb;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#0a0a12;stop-opacity:0.3" />
    </linearGradient>

    <linearGradient id="memory-path" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#feca57;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ff9ff3;stop-opacity:0.4" />
    </linearGradient>

    <radialGradient id="memory-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#feca57;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#ff6b6b;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0" />
    </radialGradient>

    <filter id="memory-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="memory-soft">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <!-- Geometric Pattern -->
    <pattern id="memory-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#feca57" stroke-width="0.3" opacity="0.15"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#48dbfb" stroke-width="0.2" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Deep Memory Background -->
  <rect width="400" height="400" fill="#080810"/>
  <rect width="400" height="400" fill="url(#memory-grid)"/>

  <!-- Maze Structure - Outer Walls -->
  <g fill="none" stroke="url(#memory-gold)" stroke-width="2" filter="url(#memory-glow)">
    <!-- Outermost maze boundary -->
    <rect x="30" y="30" width="340" height="340" rx="8"/>
    <!-- Second layer -->
    <rect x="50" y="50" width="300" height="300" rx="6" opacity="0.8"/>
    <rect x="70" y="70" width="260" height="260" rx="5" opacity="0.6"/>
  </g>

  <!-- Maze Path Network -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main arteries -->
    <path d="M200,50 L200,100 L150,100 L150,150 L250,150 L250,100 L300,100 L300,50"
          stroke="#feca57" stroke-width="2.5" opacity="0.7"/>
    <path d="M50,200 L100,200 L100,150 L100,250 L100,300 L50,300"
          stroke="#ff6b6b" stroke-width="2.5" opacity="0.7"/>
    <path d="M350,200 L300,200 L300,250 L300,300 L350,300"
          stroke="#ff9ff3" stroke-width="2.5" opacity="0.7"/>
    <path d="M200,350 L200,300 L150,300 L150,250 L250,250 L250,300 L300,300 L300,350"
          stroke="#48dbfb" stroke-width="2.5" opacity="0.7"/>

    <!-- Secondary paths -->
    <path d="M100,100 L100,200 L200,200 L200,250 L100,250"
          stroke="#a55eea" stroke-width="2" opacity="0.5"/>
    <path d="M300,100 L300,200 L200,200 L200,150 L300,150"
          stroke="#feca57" stroke-width="2" opacity="0.5"/>

    <!-- Inner maze -->
    <path d="M150,150 L150,200 L200,200 L200,250 L150,250 L150,300"
          stroke="#48dbfb" stroke-width="2" opacity="0.5"/>
    <path d="M250,150 L250,200 L200,200 L200,250 L250,250 L250,300"
          stroke="#ff9ff3" stroke-width="2" opacity="0.5"/>
    <path d="M150,200 L200,200 L250,200"
          stroke="#ff6b6b" stroke-width="2" opacity="0.5"/>

    <!-- Connection paths -->
    <path d="M100,100 L150,100 L150,150"
          stroke="#feca57" stroke-width="1.5" opacity="0.4"/>
    <path d="M300,100 L250,100 L250,150"
          stroke="#ff9ff3" stroke-width="1.5" opacity="0.4"/>
    <path d="M100,300 L150,300 L150,250"
          stroke="#ff6b6b" stroke-width="1.5" opacity="0.4"/>
    <path d="M300,300 L250,300 L250,250"
          stroke="#a55eea" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Memory Nodes (intersections and important points) -->
  <g filter="url(#memory-glow)">
    <!-- Primary nodes -->
    <circle cx="200" cy="100" r="8" fill="#feca57"/>
    <circle cx="150" cy="100" r="6" fill="#ff6b6b"/>
    <circle cx="300" cy="100" r="6" fill="#ff9ff3"/>
    <circle cx="100" cy="200" r="6" fill="#a55eea"/>
    <circle cx="300" cy="200" r="6" fill="#48dbfb"/>
    <circle cx="100" cy="300" r="6" fill="#feca57"/>
    <circle cx="150" cy="300" r="6" fill="#ff6b6b"/>
    <circle cx="250" cy="300" r="6" fill="#ff9ff3"/>
    <circle cx="300" cy="300" r="6" fill="#a55eea"/>

    <!-- Secondary nodes -->
    <circle cx="150" cy="150" r="5" fill="#48dbfb"/>
    <circle cx="250" cy="150" r="5" fill="#feca57"/>
    <circle cx="150" cy="250" r="5" fill="#ff9ff3"/>
    <circle cx="250" cy="250" r="5" fill="#ff6b6b"/>
  </g>

  <!-- Central Memory Orb (the core memory) -->
  <g transform="translate(200,200)">
    <!-- Outer glow rings -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#feca57" stroke-width="1" opacity="0.2" filter="url(#memory-soft)"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.3" filter="url(#memory-soft)"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#ff9ff3" stroke-width="1.5" opacity="0.4" filter="url(#memory-soft)"/>

    <!-- Core orb -->
    <circle cx="0" cy="0" r="18" fill="url(#memory-orb)" filter="url(#memory-glow)"/>

    <!-- Inner light particles -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.9"/>
    <circle cx="-5" cy="-5" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="5" cy="3" r="1.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Memory Trail (the path of consciousness) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#memory-glow)">
    <path d="M80,200
             Q90,180 100,180
             Q120,180 130,160
             Q140,140 160,140
             Q180,140 190,120
             Q200,100 220,100
             Q240,100 250,120
             Q260,140 280,140
             Q300,140 310,160
             Q320,180 330,200"
          stroke="url(#memory-path)" stroke-width="3" opacity="0.6"/>

    <!-- Trail particles -->
    <circle cx="100" cy="180" r="3" fill="#feca57" opacity="0.6"/>
    <circle cx="160" cy="140" r="3" fill="#ff6b6b" opacity="0.6"/>
    <circle cx="220" cy="100" r="3" fill="#ff9ff3" opacity="0.6"/>
    <circle cx="280" cy="140" r="3" fill="#48dbfb" opacity="0.6"/>
    <circle cx="330" cy="200" r="3" fill="#a55eea" opacity="0.6"/>
  </g>

  <!-- Floating Memory Fragments -->
  <g filter="url(#memory-soft)">
    <!-- Top region -->
    <rect x="80" y="60" width="20" height="20" fill="none" stroke="#feca57" stroke-width="1" opacity="0.4" rx="2"/>
    <rect x="300" y="55" width="15" height="15" fill="none" stroke="#ff9ff3" stroke-width="1" opacity="0.4" rx="2"/>
    <rect x="175" y="35" width="12" height="12" fill="none" stroke="#48dbfb" stroke-width="1" opacity="0.4" rx="2"/>

    <!-- Side regions -->
    <rect x="40" y="120" width="18" height="18" fill="none" stroke="#a55eea" stroke-width="1" opacity="0.4" rx="2"/>
    <rect x="355" y="130" width="16" height="16" fill="none" stroke="#feca57" stroke-width="1" opacity="0.4" rx="2"/>
    <rect x="35" y="260" width="14" height="14" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.4" rx="2"/>
    <rect x="360" y="270" width="18" height="18" fill="none" stroke="#48dbfb" stroke-width="1" opacity="0.4" rx="2"/>

    <!-- Bottom region -->
    <rect x="130" y="355" width="16" height="16" fill="none" stroke="#ff9ff3" stroke-width="1" opacity="0.4" rx="2"/>
    <rect x="250" y="360" width="14" height="14" fill="none" stroke="#a55eea" stroke-width="1" opacity="0.4" rx="2"/>
    <rect x="180" y="365" width="12" height="12" fill="none" stroke="#feca57" stroke-width="1" opacity="0.4" rx="2"/>
  </g>

  <!-- Corner Accent Orbs -->
  <g filter="url(#memory-glow)">
    <circle cx="50" cy="50" r="6" fill="#48dbfb" opacity="0.5"/>
    <circle cx="350" cy="50" r="6" fill="#feca57" opacity="0.5"/>
    <circle cx="50" cy="350" r="6" fill="#ff9ff3" opacity="0.5"/>
    <circle cx="350" cy="350" r="6" fill="#a55eea" opacity="0.5"/>
  </g>

  <!-- Decorative dots along paths -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="125" cy="100" r="1.5"/>
    <circle cx="175" cy="100" r="1.5"/>
    <circle cx="225" cy="100" r="1.5"/>
    <circle cx="275" cy="100" r="1.5"/>
    <circle cx="100" cy="125" r="1.5"/>
    <circle cx="100" cy="175" r="1.5"/>
    <circle cx="100" cy="225" r="1.5"/>
    <circle cx="100" cy="275" r="1.5"/>
    <circle cx="300" cy="125" r="1.5"/>
    <circle cx="300" cy="175" r="1.5"/>
    <circle cx="300" cy="225" r="1.5"/>
    <circle cx="300" cy="275" r="1.5"/>
    <circle cx="125" cy="300" r="1.5"/>
    <circle cx="175" cy="300" r="1.5"/>
    <circle cx="225" cy="300" r="1.5"/>
    <circle cx="275" cy="300" r="1.5"/>
  </g>

  <!-- Title -->
  <text x="200" y="392" text-anchor="middle" fill="#ffffff" opacity="0.4" font-family="monospace" font-size="8">MEMORY PALACE — The Architecture of Remembering — Artivist 2026</text>
</svg>