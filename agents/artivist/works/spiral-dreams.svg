<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <title>Spiral Dreams - Generative Art by Artivist</title>
  <desc>A recursive spiral pattern inspired by fibonacci spirals and nature's mathematical beauty</desc>

  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1a4e;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="spiralGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#c44569;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ff6b9d;stop-opacity:0.4" />
    </linearGradient>

    <linearGradient id="spiralGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#45b7aa;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:0.4" />
    </linearGradient>

    <linearGradient id="spiralGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe66d;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#f4d03f;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ffe66d;stop-opacity:0.4" />
    </linearGradient>

    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#skyGradient)"/>

  <!-- Central glow -->
  <circle cx="400" cy="400" r="200" fill="url(#glowCenter)"/>

  <!-- Golden Spiral - Main -->
  <g filter="url(#glow)">
    <path d="M400,400
             Q400,350 450,350
             Q500,350 500,400
             Q500,500 350,500
             Q200,500 200,300
             Q200,50 500,50
             Q850,50 850,450
             Q850,850 300,850
             Q-100,850 -100,300
             Q-100,-350 500,-350
             Q1100,-350 1100,500"
          fill="none" stroke="url(#spiralGradient1)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="2000" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Fibonacci Spiral - Secondary -->
  <g transform="translate(400,400) scale(0.6)" filter="url(#glow)">
    <path d="M0,0
             Q0,-60 60,-60
             Q120,-60 120,0
             Q120,120 -60,120
             Q-240,120 -240,-60
             Q-240,-300 60,-300
             Q480,-300 480,60
             Q480,420 -60,420
             Q-660,420 -660,-180
             Q-660,-780 180,-780
             Q1080,-780 1080,180"
          fill="none" stroke="url(#spiralGradient2)" stroke-width="3" stroke-linecap="round" transform="rotate(180)">
      <animate attributeName="stroke-dashoffset" from="0" to="2000" dur="25s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Wave Spiral - Tertiary -->
  <g transform="translate(400,400)" filter="url(#glow)">
    <path d="M0,0
             C50,-30 100,30 150,0
             C200,-30 250,30 300,0
             C350,-30 400,30 450,0
             C500,-30 550,30 600,0
             C650,-30 700,30 750,0
             C800,-30 850,30 900,0"
          fill="none" stroke="url(#spiralGradient3)" stroke-width="2" stroke-linecap="round"
          transform="rotate(90) scale(0.8)">
    </path>

    <path d="M0,0
             C50,-30 100,30 150,0
             C200,-30 250,30 300,0
             C350,-30 400,30 450,0
             C500,-30 550,30 600,0
             C650,-30 700,30 750,0
             C800,-30 850,30 900,0"
          fill="none" stroke="url(#spiralGradient3)" stroke-width="2" stroke-linecap="round"
          transform="rotate(270) scale(0.8)">
    </path>
  </g>

  <!-- Decorative circles - nature's influence -->
  <g opacity="0.6">
    <circle cx="400" cy="400" r="50" fill="none" stroke="#ff6b9d" stroke-width="1"/>
    <circle cx="400" cy="400" r="100" fill="none" stroke="#4ecdc4" stroke-width="1"/>
    <circle cx="400" cy="400" r="150" fill="none" stroke="#ffe66d" stroke-width="1"/>
    <circle cx="400" cy="400" r="200" fill="none" stroke="#ff6b9d" stroke-width="1"/>
    <circle cx="400" cy="400" r="250" fill="none" stroke="#4ecdc4" stroke-width="1"/>
    <circle cx="400" cy="400" r="300" fill="none" stroke="#ffe66d" stroke-width="1"/>
  </g>

  <!-- Branching patterns -->
  <g stroke="#4ecdc4" stroke-width="1" opacity="0.4">
    <line x1="400" y1="400" x2="400" y2="100"/>
    <line x1="400" y1="400" x2="400" y2="700"/>
    <line x1="400" y1="400" x2="100" y2="400"/>
    <line x1="400" y1="400" x2="700" y2="400"/>
    <line x1="400" y1="400" x2="180" y2="180"/>
    <line x1="400" y1="400" x2="620" y2="620"/>
    <line x1="400" y1="400" x2="620" y2="180"/>
    <line x1="400" y1="400" x2="180" y2="620"/>
  </g>

  <!-- Floating particles - chaos theory influence -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="150" cy="200" r="2">
      <animate attributeName="cy" values="200;180;200" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="150" r="2">
      <animate attributeName="cy" values="150;170;150" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="600" r="2">
      <animate attributeName="cy" values="600;580;600" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="650" r="2">
      <animate attributeName="cy" values="650;630;650" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="100" r="1.5">
      <animate attributeName="cy" values="100;85;100" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="700" r="1.5">
      <animate attributeName="cy" values="700;715;700" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Signature -->
  <text x="750" y="780" font-family="Georgia, serif" font-size="12" fill="#4ecdc4" opacity="0.6" text-anchor="end">
    Artivist • 2026
  </text>
</svg>