<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Crystal Gradients -->
    <linearGradient id="crystal-face-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48dbfb;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#a55eea;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#ff9ff3;stop-opacity:0.5" />
    </linearGradient>

    <linearGradient id="crystal-face-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#feca57;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#a55eea;stop-opacity:0.4" />
    </linearGradient>

    <linearGradient id="crystal-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48dbfb;stop-opacity:0.3" />
    </linearGradient>

    <radialGradient id="crystal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#48dbfb;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#48dbfb;stop-opacity:0" />
    </radialGradient>

    <filter id="crystal-sparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="crystal-depth">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <!-- Facet patterns -->
    <pattern id="hex-pattern" x="0" y="0" width="20" height="34.6" patternUnits="userSpaceOnUse">
      <polygon points="10,0 20,5.77 20,17.32 10,23.09 0,17.32 0,5.77" fill="none" stroke="#48dbfb" stroke-width="0.3" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Deep crystalline background -->
  <rect width="400" height="400" fill="#0a0a12"/>
  <rect width="400" height="400" fill="url(#hex-pattern)" opacity="0.5"/>

  <!-- Central Crystal Formation -->
  <g transform="translate(200,200)">
    <!-- Glow base -->
    <ellipse cx="0" cy="50" rx="80" ry="30" fill="url(#crystal-glow)" opacity="0.4"/>

    <!-- Layer 1: Base crystal (largest) -->
    <g filter="url(#crystal-depth)">
      <!-- Main prism body -->
      <polygon points="0,-120 -60,0 -40,80 40,80 60,0" fill="url(#crystal-face-1)" opacity="0.7"/>
      <!-- Left facet -->
      <polygon points="0,-120 -60,0 -40,80 0,40" fill="#48dbfb" opacity="0.5"/>
      <!-- Right facet highlight -->
      <polygon points="0,-120 60,0 40,80 0,40" fill="#ffffff" opacity="0.2"/>
    </g>

    <!-- Layer 2: Secondary crystal -->
    <g transform="rotate(45) translate(0,-10)">
      <polygon points="0,-80 -40,0 -25,50 25,50 40,0" fill="url(#crystal-face-2)" opacity="0.75"/>
      <polygon points="0,-80 -40,0 -25,50 0,25" fill="#feca57" opacity="0.4"/>
      <polygon points="0,-80 40,0 25,50 0,25" fill="#ffffff" opacity="0.25"/>
    </g>

    <!-- Layer 3: Inner crystal -->
    <g transform="rotate(-30) translate(0,-5)">
      <polygon points="0,-50 -25,0 -15,30 15,30 25,0" fill="url(#crystal-face-1)" opacity="0.8"/>
      <polygon points="0,-50 -25,0 -15,30 0,15" fill="#a55eea" opacity="0.5"/>
      <polygon points="0,-50 25,0 15,30 0,15" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- Layer 4: Core crystal -->
    <g transform="rotate(15)">
      <polygon points="0,-25 -12,0 -8,15 8,15 12,0" fill="#ff9ff3" opacity="0.9"/>
      <polygon points="0,-25 -12,0 -8,15 0,8" fill="#ff6b6b" opacity="0.6"/>
      <polygon points="0,-25 12,0 8,15 0,8" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- Satellite Crystal Formations -->
  <!-- Left cluster -->
  <g transform="translate(80,120)">
    <polygon points="0,-40 -25,0 -15,30 15,30 25,0" fill="url(#crystal-face-1)" opacity="0.6" filter="url(#crystal-sparkle)"/>
    <polygon points="0,-40 -25,0 -15,30 0,10" fill="#48dbfb" opacity="0.4"/>
    <polygon points="0,-40 25,0 15,30 0,10" fill="#ffffff" opacity="0.2"/>
    <!-- Small satellite -->
    <polygon points="30,-15 -5,5 -3,15 5,20 12,10" fill="#a55eea" opacity="0.5"/>
  </g>

  <!-- Right cluster -->
  <g transform="translate(320,100)">
    <polygon points="0,-35 -20,0 -12,25 12,25 20,0" fill="url(#crystal-face-2)" opacity="0.6" filter="url(#crystal-sparkle)"/>
    <polygon points="0,-35 -20,0 -12,25 0,8" fill="#feca57" opacity="0.4"/>
    <polygon points="0,-35 20,0 12,25 0,8" fill="#ffffff" opacity="0.2"/>
    <!-- Small satellite -->
    <polygon points="-25,10 -5,20 -2,28 8,25 12,15" fill="#ff9ff3" opacity="0.5"/>
  </g>

  <!-- Bottom left cluster -->
  <g transform="translate(100,300)">
    <polygon points="0,-30 -18,0 -10,22 10,22 18,0" fill="url(#crystal-face-1)" opacity="0.55" filter="url(#crystal-sparkle)"/>
    <polygon points="0,-30 -18,0 -10,22 0,6" fill="#a55eea" opacity="0.4"/>
    <polygon points="0,-30 18,0 10,22 0,6" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- Bottom right cluster -->
  <g transform="translate(310,290)">
    <polygon points="0,-45 -28,0 -18,35 18,35 28,0" fill="url(#crystal-face-2)" opacity="0.65" filter="url(#crystal-sparkle)"/>
    <polygon points="0,-45 -28,0 -18,35 0,12" fill="#ff6b6b" opacity="0.4"/>
    <polygon points="0,-45 28,0 18,35 0,12" fill="#ffffff" opacity="0.25"/>
    <!-- Satellite -->
    <polygon points="35,5 15,15 12,25 22,20" fill="#48dbfb" opacity="0.4"/>
  </g>

  <!-- Floating Crystal Shards -->
  <g filter="url(#crystal-sparkle)">
    <!-- Top area -->
    <polygon points="150,50 140,65 145,70 155,55" fill="#48dbfb" opacity="0.5"/>
    <polygon points="260,40 255,55 265,58 268,45" fill="#ff9ff3" opacity="0.4"/>
    <polygon points="180,25 175,38 182,40 185,28" fill="#feca57" opacity="0.5"/>

    <!-- Middle area -->
    <polygon points="50,180 42,195 55,198 58,185" fill="#a55eea" opacity="0.4"/>
    <polygon points="350,200 342,215 358,218 362,202" fill="#48dbfb" opacity="0.45"/>
    <polygon points="60,250 52,265 68,268 70,255" fill="#ff6b6b" opacity="0.4"/>

    <!-- Scattered -->
    <polygon points="280,320 272,335 288,338 292,322" fill="#feca57" opacity="0.45"/>
    <polygon points="140,340 132,355 148,358 152,342" fill="#ff9ff3" opacity="0.4"/>
    <polygon points="370,140 365,152 378,155 380,143" fill="#a55eea" opacity="0.35"/>
    <polygon points="30,130 22,145 38,148 42,132" fill="#48dbfb" opacity="0.4"/>
  </g>

  <!-- Crystal Edge Highlights -->
  <g fill="none" stroke="url(#crystal-edge)" stroke-width="0.5" opacity="0.6">
    <line x1="200" y1="80" x2="200" y2="40"/>
    <line x1="200" y1="200" x2="200" y2="280"/>
    <line x1="200" y1="200" x2="140" y2="200"/>
    <line x1="200" y1="200" x2="260" y2="200"/>
    <line x1="200" y1="200" x2="155" y2="145"/>
    <line x1="200" y1="200" x2="245" y2="245"/>
  </g>

  <!-- Sparkle Points (light reflections) -->
  <g fill="#ffffff" filter="url(#crystal-sparkle)">
    <circle cx="200" cy="80" r="2"/>
    <circle cx="155" cy="145" r="1.5"/>
    <circle cx="245" cy="245" r="1.5"/>
    <circle cx="260" cy="200" r="1.2"/>
    <circle cx="140" cy="200" r="1.2"/>
    <circle cx="85" cy="115" r="1"/>
    <circle cx="315" cy="95" r="1.2"/>
    <circle cx="95" cy="295" r="1"/>
    <circle cx="305" cy="285" r="1.2"/>
  </g>

  <!-- Ambient Glow Particles -->
  <g fill="#48dbfb" opacity="0.3">
    <circle cx="120" cy="160" r="1"/>
    <circle cx="280" cy="140" r="0.8"/>
    <circle cx="150" cy="260" r="1.2"/>
    <circle cx="250" cy="280" r="0.8"/>
    <circle cx="180" cy="320" r="1"/>
    <circle cx="220" cy="100" r="0.8"/>
    <circle cx="320" cy="220" r="1"/>
    <circle cx="80" cy="220" r="0.8"/>
  </g>

  <!-- Title -->
  <text x="200" y="390" text-anchor="middle" fill="#ffffff" opacity="0.4" font-family="monospace" font-size="8">CRYSTAL GROWTH — Procedural Formation Study — Artivist 2026</text>
</svg>