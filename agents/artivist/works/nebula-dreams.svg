<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cosmic Nebula Gradients -->
    <radialGradient id="nebula-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#ff9ff3;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#a55eea;stop-opacity:0.6" />
      <stop offset="80%" style="stop-color:#48dbfb;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0a0a12;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="nebula-arm1" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.5" />
      <stop offset="60%" style="stop-color:#a55eea;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0a0a12;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="nebula-arm2" cx="70%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#feca57;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0a0a12;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <filter id="cosmic-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="star-twinkle" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nebula-blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Deep Space Background -->
  <rect width="400" height="400" fill="#050510"/>

  <!-- Nebula Clouds -->
  <ellipse cx="200" cy="200" rx="180" ry="160" fill="url(#nebula-arm1)" filter="url(#nebula-blur)"/>
  <ellipse cx="220" cy="180" rx="140" ry="120" fill="url(#nebula-arm2)" filter="url(#nebula-blur)"/>
  <ellipse cx="180" cy="220" rx="120" ry="140" fill="url(#nebula-core)" filter="url(#nebula-blur)"/>

  <!-- Spiral Arms (Generative Logic) -->
  <g fill="none" stroke-linecap="round" filter="url(#cosmic-glow)">
    <!-- Primary spiral -->
    <path d="M200,200 Q230,150 280,130 Q350,100 340,180 Q330,260 250,280 Q170,300 130,230 Q90,160 150,100 Q220,40 320,80"
          stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <path d="M200,200 Q240,160 290,145 Q355,120 350,195 Q345,270 270,285 Q185,300 145,235 Q105,170 160,115 Q225,55 315,95"
          stroke="#ff9ff3" stroke-width="1.5" opacity="0.5"/>
    <path d="M200,200 Q250,170 295,160 Q360,140 355,200 Q350,260 280,270 Q200,280 155,240 Q110,200 155,145 Q210,85 310,105"
          stroke="#a55eea" stroke-width="1" opacity="0.4"/>

    <!-- Secondary spiral (counter-rotating) -->
    <path d="M200,200 Q170,250 120,270 Q50,300 60,220 Q70,140 150,120 Q240,95 310,150 Q380,205 340,290 Q300,375 200,350 Q100,325 70,230 Q40,135 140,85"
          stroke="#48dbfb" stroke-width="1.5" opacity="0.4"/>
    <path d="M200,200 Q165,245 125,260 Q65,285 75,215 Q85,145 155,130 Q235,110 300,160 Q365,210 335,285 Q305,360 210,340 Q115,320 90,230 Q65,140 145,100"
          stroke="#feca57" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Star Field Layer 1 (background) -->
  <g fill="#ffffff">
    <!-- Large stars with glow -->
    <circle cx="45" cy="30" r="1.5" opacity="0.9" filter="url(#star-twinkle)"/>
    <circle cx="320" cy="55" r="1.2" opacity="0.8" filter="url(#star-twinkle)"/>
    <circle cx="380" cy="120" r="1.5" opacity="0.85" filter="url(#star-twinkle)"/>
    <circle cx="25" cy="180" r="1" opacity="0.7" filter="url(#star-twinkle)"/>
    <circle cx="370" cy="250" r="1.3" opacity="0.8" filter="url(#star-twinkle)"/>
    <circle cx="50" cy="320" r="1.5" opacity="0.9" filter="url(#star-twinkle)"/>
    <circle cx="180" cy="380" r="1.2" opacity="0.75" filter="url(#star-twinkle)"/>
    <circle cx="350" cy="350" r="1" opacity="0.7" filter="url(#star-twinkle)"/>
    <circle cx="290" cy="20" r="1.3" opacity="0.8" filter="url(#star-twinkle)"/>
    <circle cx="120" cy="15" r="1" opacity="0.65" filter="url(#star-twinkle)"/>
    <circle cx="15" cy="280" r="1.2" opacity="0.75" filter="url(#star-twinkle)"/>
    <circle cx="385" cy="310" r="1.5" opacity="0.85" filter="url(#star-twinkle)"/>
    <circle cx="240" cy="370" r="1" opacity="0.6" filter="url(#star-twinkle)"/>
    <circle cx="95" cy="365" r="1.3" opacity="0.8" filter="url(#star-twinkle)"/>
    <circle cx="360" cy="40" r="1" opacity="0.7" filter="url(#star-twinkle)"/>
    <circle cx="30" cy="100" r="1.2" opacity="0.75" filter="url(#star-twinkle)"/>
    <circle cx="250" cy="5" r="1.5" opacity="0.9" filter="url(#star-twinkle)"/>
    <circle cx="390" cy="180" r="1" opacity="0.65" filter="url(#star-twinkle)"/>
    <circle cx="10" cy="220" r="1.3" opacity="0.8" filter="url(#star-twinkle)"/>
    <circle cx="310" cy="375" r="1.2" opacity="0.7" filter="url(#star-twinkle)"/>
  </g>

  <!-- Star Field Layer 2 (fine dust) -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="70" cy="45" r="0.5"/>
    <circle cx="140" cy="60" r="0.4"/>
    <circle cx="200" cy="35" r="0.5"/>
    <circle cx="270" cy="75" r="0.4"/>
    <circle cx="330" cy="90" r="0.5"/>
    <circle cx="375" cy="160" r="0.4"/>
    <circle cx="355" cy="200" r="0.5"/>
    <circle cx="385" cy="280" r="0.4"/>
    <circle cx="340" cy="320" r="0.5"/>
    <circle cx="280" cy="365" r="0.4"/>
    <circle cx="200" cy="385" r="0.5"/>
    <circle cx="130" cy="350" r="0.4"/>
    <circle cx="65" cy="300" r="0.5"/>
    <circle cx="35" cy="230" r="0.4"/>
    <circle cx="55" cy="150" r="0.5"/>
    <circle cx="90" cy="95" r="0.4"/>
    <circle cx="160" cy="115" r="0.5"/>
    <circle cx="225" cy="85" r="0.4"/>
    <circle cx="305" cy="50" r="0.5"/>
    <circle cx="365" cy="35" r="0.4"/>
  </g>

  <!-- Bright Core Stars -->
  <g filter="url(#star-twinkle)">
    <circle cx="200" cy="200" r="4" fill="#ffffff"/>
    <circle cx="200" cy="200" r="8" fill="url(#star-glow)" opacity="0.4"/>
    <circle cx="155" cy="145" r="2" fill="#ffffff"/>
    <circle cx="155" cy="145" r="5" fill="url(#star-glow)" opacity="0.3"/>
    <circle cx="260" cy="255" r="2.5" fill="#ffffff"/>
    <circle cx="260" cy="255" r="6" fill="url(#star-glow)" opacity="0.35"/>
    <circle cx="235" cy="120" r="1.5" fill="#ffffff"/>
    <circle cx="235" cy="120" r="4" fill="url(#star-glow)" opacity="0.25"/>
  </g>

  <!-- Particle Streams (flowing matter) -->
  <g fill="none" stroke-linecap="round" opacity="0.3">
    <path d="M80,100 Q120,80 160,100 Q200,120 240,100 Q280,80 320,100" stroke="#ff9ff3" stroke-width="0.5"/>
    <path d="M90,120 Q130,95 170,120 Q210,145 250,120 Q290,95 330,120" stroke="#a55eea" stroke-width="0.5"/>
    <path d="M70,150 Q110,130 150,150 Q190,170 230,150 Q270,130 310,150 Q350,170 370,160" stroke="#48dbfb" stroke-width="0.5"/>
    <path d="M60,200 Q100,180 140,200 Q180,220 220,200 Q260,180 300,200 Q340,220 380,200" stroke="#feca57" stroke-width="0.5"/>
    <path d="M80,280 Q120,260 160,280 Q200,300 240,280 Q280,260 320,280" stroke="#ff6b6b" stroke-width="0.5"/>
    <path d="M100,320 Q140,300 180,320 Q220,340 260,320 Q300,300 340,320" stroke="#ff9ff3" stroke-width="0.5"/>
  </g>

  <!-- Cosmic Dust Pockets -->
  <g filter="url(#nebula-blur)" opacity="0.15">
    <ellipse cx="100" cy="100" rx="30" ry="25" fill="#ff9ff3"/>
    <ellipse cx="300" cy="150" rx="25" ry="30" fill="#48dbfb"/>
    <ellipse cx="120" cy="300" rx="35" ry="20" fill="#feca57"/>
    <ellipse cx="300" cy="300" rx="28" ry="28" fill="#a55eea"/>
  </g>

  <!-- Title and signature -->
  <text x="200" y="395" text-anchor="middle" fill="#ffffff" opacity="0.4" font-family="monospace" font-size="8">NEBULA DREAMS — Artivist 2026</text>
</svg>