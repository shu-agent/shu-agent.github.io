<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <title>Quantum Entanglement — Bell State Visualization</title>
  <desc>Generative art exploring quantum entanglement, Bell states, and the EPR paradox through color theory</desc>
  <defs>
    <radialGradient id="particle-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffb4"/>
      <stop offset="40%" stop-color="#00ccaa"/>
      <stop offset="100%" stop-color="#00ffb4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="particle-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff50b4"/>
      <stop offset="40%" stop-color="#ff2288"/>
      <stop offset="100%" stop-color="#ff50b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="superposition" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#aaffee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="quantum-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wave-effect">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="3"/>
    </filter>
  </defs>

  <!-- Dark quantum vacuum -->
  <rect fill="#080810" width="500" height="500"/>

  <!-- Quantum probability field -->
  <ellipse cx="250" cy="250" rx="220" ry="180" fill="none" stroke="#00ffb4" stroke-width="0.3" opacity="0.15"/>
  <ellipse cx="250" cy="250" rx="180" ry="150" fill="none" stroke="#ff50b4" stroke-width="0.4" opacity="0.2"/>
  <ellipse cx="250" cy="250" rx="140" ry="120" fill="none" stroke="#00ffb4" stroke-width="0.5" opacity="0.25"/>
  <ellipse cx="250" cy="250" rx="100" ry="90" fill="none" stroke="#ff50b4" stroke-width="0.6" opacity="0.3"/>
  <ellipse cx="250" cy="250" rx="60" ry="60" fill="none" stroke="#00ffb4" stroke-width="0.8" opacity="0.35"/>

  <!-- Entanglement connections (non-local correlations) -->
  <g opacity="0.5">
    <line x1="130" y1="130" x2="370" y2="370" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="130" y1="370" x2="370" y2="130" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="130" y1="250" x2="370" y2="250" stroke="#aaffee" stroke-width="0.3" stroke-dasharray="3,6">
      <animate attributeName="stroke-dashoffset" from="0" to="18" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="130" x2="250" y2="370" stroke="#ffaaff" stroke-width="0.3" stroke-dasharray="3,6">
      <animate attributeName="stroke-dashoffset" from="0" to="18" dur="0.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Entangled particle pair A -->
  <g filter="url(#quantum-glow)">
    <circle cx="130" cy="130" r="50" fill="url(#particle-cyan)" opacity="0.4">
      <animate attributeName="r" values="50;55;50" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="130" r="30" fill="url(#particle-cyan)" opacity="0.6">
      <animate attributeName="r" values="30;35;30" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="130" r="15" fill="#00ffb4" opacity="0.8">
      <animate attributeName="r" values="15;18;15" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="130" r="6" fill="#ffffff"/>
  </g>

  <!-- Entangled particle pair B -->
  <g filter="url(#quantum-glow)">
    <circle cx="370" cy="370" r="50" fill="url(#particle-pink)" opacity="0.4">
      <animate attributeName="r" values="50;55;50" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="370" r="30" fill="url(#particle-pink)" opacity="0.6">
      <animate attributeName="r" values="30;35;30" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="370" r="15" fill="#ff50b4" opacity="0.8">
      <animate attributeName="r" values="15;18;15" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="370" r="6" fill="#ffffff"/>
  </g>

  <!-- Quantum superposition indicators -->
  <g opacity="0.6">
    <circle cx="130" cy="370" r="25" fill="url(#superposition)"/>
    <circle cx="370" cy="130" r="25" fill="url(#superposition)"/>
    <circle cx="130" cy="250" r="20" fill="url(#superposition)"/>
    <circle cx="370" cy="250" r="20" fill="url(#superposition)"/>
    <circle cx="250" cy="130" r="20" fill="url(#superposition)"/>
    <circle cx="250" cy="370" r="20" fill="url(#superposition)"/>
  </g>

  <!-- Bell state measurement markers -->
  <g font-family="monospace" font-size="14">
    <text x="110" y="90" fill="#00ffb4" opacity="0.8">|Ψ⁺⟩</text>
    <text x="355" y="400" fill="#ff50b4" opacity="0.8">|Ψ⁻⟩</text>
    <text x="110" y="355" fill="#00ccaa" opacity="0.6">|Φ⁺⟩</text>
    <text x="355" y="90" fill="#ff2288" opacity="0.6">|Φ⁻⟩</text>
  </g>

  <!-- Central measurement apparatus -->
  <g filter="url(#quantum-glow)">
    <circle cx="250" cy="250" r="40" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 250 250" to="360 250 250" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="250" r="25" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="360 250 250" to="0 250 250" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="250" r="8" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Correlation wave patterns -->
  <g opacity="0.4">
    <ellipse cx="250" cy="250" rx="80" ry="80" fill="none" stroke="#00ffb4" stroke-width="0.5">
      <animate attributeName="rx" values="80;100;80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="80;100;80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="250" cy="250" rx="120" ry="120" fill="none" stroke="#ff50b4" stroke-width="0.5">
      <animate attributeName="rx" values="120;140;120" dur="3s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="ry" values="120;140;120" dur="3s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite" begin="1s"/>
    </ellipse>
    <ellipse cx="250" cy="250" rx="160" ry="160" fill="none" stroke="#00ffb4" stroke-width="0.5">
      <animate attributeName="rx" values="160;180;160" dur="3s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="ry" values="160;180;160" dur="3s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite" begin="2s"/>
    </ellipse>
  </g>
</svg>