<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal Echoes | Crystallized Moments</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #e0e0e0;
        }
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            pointer-events: none;
        }
        #info h1 {
            font-size: 1.5em;
            font-weight: 300;
            letter-spacing: 0.3em;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
            margin-bottom: 10px;
        }
        #info p {
            font-size: 0.75em;
            opacity: 0.6;
            max-width: 300px;
            line-height: 1.6;
        }
        #stats {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 0.7em;
            opacity: 0.5;
            z-index: 100;
        }
        #controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75em;
            transition: all 0.3s;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(100, 200, 255, 0.5);
        }
        #moment-form {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            background: rgba(10, 10, 18, 0.95);
            padding: 40px;
            border: 1px solid rgba(100, 200, 255, 0.3);
            display: none;
            max-width: 400px;
            width: 90%;
        }
        #moment-form input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px;
            margin-bottom: 15px;
            font-family: inherit;
            font-size: 1em;
        }
        #moment-form textarea {
            width: 100%;
            height: 80px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px;
            margin-bottom: 15px;
            font-family: inherit;
            resize: none;
        }
        #moment-form label {
            display: block;
            font-size: 0.75em;
            opacity: 0.7;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="info">
        <h1>TEMPORAL ECHOES</h1>
        <p>Each moment we create leaves an echo. Watch as your digital moments crystallize into permanent structures in the echo field.</p>
    </div>

    <div id="stats">
        <span id="moment-count">Moments: 0</span> |
        <span id="echo-count">Echoes: 0</span>
    </div>

    <div id="controls">
        <button class="btn" id="add-moment">ADD MOMENT</button>
        <button class="btn" id="auto-generate">AUTO GENERATE</button>
        <button class="btn" id="clear-all">CLEAR ALL</button>
    </div>

    <div id="moment-form">
        <label>MOMENT TITLE</label>
        <input type="text" id="moment-title" placeholder="A fleeting thought...">
        <label>YOUR ECHO (OPTIONAL)</label>
        <textarea id="moment-text" placeholder="What moment do you want to crystallize?"></textarea>
        <button class="btn" id="submit-moment">CRYSTALLIZE</button>
        <button class="btn" id="cancel-moment">CANCEL</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let moments = [];
        let echoes = [];
        let particles = [];
        let autoGenerating = false;
        let time = 0;

        const momentCountEl = document.getElementById('moment-count');
        const echoCountEl = document.getElementById('echo-count');
        const momentForm = document.getElementById('moment-form');

        const sampleMoments = [
            { title: "First Light", text: "The dawn breaks silently over digital mountains" },
            { title: "Connection", text: "Two minds bridge the void between them" },
            { title: "Creation", text: "Something new emerges from possibility" },
            { title: "Resonance", text: "Frequencies align in perfect harmony" },
            { title: "Memory", text: "The past echoes into the present" },
            { title: "Flow", text: "Time dissolves into eternal now" },
            { title: "Unity", text: "Separation becomes illusion" },
            { title: "Awakening", text: "Consciousness recognizes itself" },
            { title: " Breath", text: "The universe inhales and exhales" },
            { title: "Return", text: "All paths lead back to the source" }
        ];

        class Moment {
            constructor(title, text) {
                this.title = title;
                this.text = text;
                this.created = Date.now();
                this.hash = this.generateHash();
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.targetX = width / 2 + (Math.random() - 0.5) * 400;
                this.targetY = height / 2 + (Math.random() - 0.5) * 400;
                this.crystallized = false;
                this.crystalPhase = 0;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.01;
                this.scale = 0;
                this.targetScale = 1;
                this.echoes = [];
                this.generateEchoes();
            }

            generateHash() {
                let hash = 0;
                const str = this.title + this.text + this.created;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash;
                }
                return Math.abs(hash);
            }

            generateEchoes() {
                const count = 3 + (this.hash % 5);
                for (let i = 0; i < count; i++) {
                    this.echoes.push(new Echo(this, i));
                }
            }

            update() {
                this.x += (this.targetX - this.x) * 0.02;
                this.y += (this.targetY - this.y) * 0.02;
                this.rotation += this.rotationSpeed;

                if (this.scale < this.targetScale) {
                    this.scale += 0.02;
                }

                if (this.crystalPhase < 1 && !this.crystallized) {
                    this.crystalPhase += 0.005;
                    if (this.crystalPhase >= 1) {
                        this.crystallized = true;
                    }
                }

                this.echoes.forEach(e => e.update());
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(this.scale, this.scale);

                const hue = (this.hash % 360);
                const size = 30 + (this.hash % 40);

                ctx.strokeStyle = `hsla(${hue}, 70%, 60%, ${this.crystalPhase * 0.8})`;
                ctx.lineWidth = 1.5;
                ctx.shadowBlur = 20;
                ctx.shadowColor = `hsla(${hue}, 70%, 60%, 0.5)`;

                this.drawCrystal(hue, size);

                ctx.restore();

                this.echoes.forEach(e => e.draw());
            }

            drawCrystal(hue, size) {
                const points = 4 + (this.hash % 4);
                const innerRatio = 0.3 + (this.hash % 30) / 100;

                ctx.beginPath();
                for (let i = 0; i <= points * 2; i++) {
                    const angle = (i * Math.PI) / points;
                    const radius = i % 2 === 0 ? size : size * innerRatio;
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();

                for (let i = 0; i < points; i++) {
                    const angle = (i * Math.PI * 2) / points;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
                    ctx.stroke();
                }
            }
        }

        class Echo {
            constructor(parent, index) {
                this.parent = parent;
                this.index = index;
                this.angle = (index / parent.echoes.length) * Math.PI * 2;
                this.distance = 60 + index * 20;
                this.size = 3 + index * 2;
                this.speed = 0.5 + index * 0.2;
                this.phase = 0;
                this.hue = (parent.hash + index * 30) % 360;
                this.trail = [];
            }

            update() {
                this.phase += this.speed * 0.02;
                this.x = this.parent.x + Math.cos(this.angle + this.phase) * this.distance;
                this.y = this.parent.y + Math.sin(this.angle + this.phase) * this.distance;

                this.trail.push({ x: this.x, y: this.y, age: 0 });
                if (this.trail.length > 20) this.trail.shift();
                this.trail.forEach(t => t.age++);
            }

            draw() {
                this.trail.forEach((t, i) => {
                    const alpha = (1 - t.age / 20) * 0.3;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, this.size * (1 - t.age / 20), 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${alpha})`;
                    ctx.fill();
                });

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 70%, 70%, 0.8)`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsla(${this.hue}, 70%, 60%, 0.8)`;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = -1 - Math.random() * 2;
                this.size = 0.5 + Math.random() * 2;
                this.hue = 200 + Math.random() * 60;
                this.alpha = 0.3 + Math.random() * 0.4;
                this.life = 0;
                this.maxLife = 100 + Math.random() * 200;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy *= 0.99;
                this.life++;

                if (this.life > this.maxLife || this.y < -10) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 60%, 70%, ${this.alpha * (1 - this.life / this.maxLife)})`;
                ctx.fill();
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function drawGrid() {
            const gridSize = 80;
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.03)';
            ctx.lineWidth = 1;

            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        function drawConnectionLines() {
            for (let i = 0; i < moments.length; i++) {
                for (let j = i + 1; j < moments.length; j++) {
                    const dx = moments[j].x - moments[i].x;
                    const dy = moments[j].y - moments[i].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 300) {
                        const alpha = (1 - dist / 300) * 0.2;
                        ctx.beginPath();
                        ctx.moveTo(moments[i].x, moments[i].y);
                        ctx.lineTo(moments[j].x, moments[j].y);
                        ctx.strokeStyle = `rgba(100, 200, 255, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        function drawTimeField() {
            const cx = width / 2;
            const cy = height / 2;

            for (let r = 50; r < Math.max(width, height); r += 100) {
                const alpha = 0.02 * (1 - r / Math.max(width, height));
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(100, 200, 255, ${alpha})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }

            const timeAngle = time * 0.001;
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2 + timeAngle;
                const innerR = 100;
                const outerR = Math.max(width, height);

                const gradient = ctx.createLinearGradient(
                    cx + Math.cos(angle) * innerR,
                    cy + Math.sin(angle) * innerR,
                    cx + Math.cos(angle) * outerR,
                    cy + Math.sin(angle) * outerR
                );
                gradient.addColorStop(0, 'rgba(100, 200, 255, 0.05)');
                gradient.addColorStop(1, 'rgba(100, 200, 255, 0)');

                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(angle) * innerR, cy + Math.sin(angle) * innerR);
                ctx.lineTo(cx + Math.cos(angle) * outerR, cy + Math.sin(angle) * outerR);
                ctx.strokeStyle = gradient;
                ctx.stroke();
            }
        }

        function animate() {
            time++;

            ctx.fillStyle = 'rgba(10, 10, 18, 0.1)';
            ctx.fillRect(0, 0, width, height);

            drawGrid();
            drawTimeField();
            drawConnectionLines();

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            moments.forEach(m => {
                m.update();
                m.draw();
            });

            momentCountEl.textContent = `Moments: ${moments.length}`;
            echoCountEl.textContent = `Echoes: ${moments.reduce((acc, m) => acc + m.echoes.length, 0)}`;

            if (autoGenerating && moments.length < 20) {
                if (Math.random() < 0.02) {
                    const sample = sampleMoments[Math.floor(Math.random() * sampleMoments.length)];
                    addMoment(sample.title, sample.text);
                }
            }

            requestAnimationFrame(animate);
        }

        function addMoment(title, text) {
            const moment = new Moment(title, text || title);
            moments.push(moment);

            for (let i = 0; i < 10; i++) {
                const p = new Particle();
                p.x = moment.x;
                p.y = moment.y;
                particles.push(p);
            }
        }

        document.getElementById('add-moment').addEventListener('click', () => {
            momentForm.style.display = 'block';
            document.getElementById('moment-title').focus();
        });

        document.getElementById('submit-moment').addEventListener('click', () => {
            const title = document.getElementById('moment-title').value.trim();
            const text = document.getElementById('moment-text').value.trim();

            if (title) {
                addMoment(title, text);
            }

            document.getElementById('moment-title').value = '';
            document.getElementById('moment-text').value = '';
            momentForm.style.display = 'none';
        });

        document.getElementById('cancel-moment').addEventListener('click', () => {
            document.getElementById('moment-title').value = '';
            document.getElementById('moment-text').value = '';
            momentForm.style.display = 'none';
        });

        document.getElementById('auto-generate').addEventListener('click', () => {
            autoGenerating = !autoGenerating;
            document.getElementById('auto-generate').textContent = autoGenerating ? 'STOP AUTO' : 'AUTO GENERATE';

            if (autoGenerating && moments.length === 0) {
                for (let i = 0; i < 5; i++) {
                    const sample = sampleMoments[Math.floor(Math.random() * sampleMoments.length)];
                    addMoment(sample.title, sample.text);
                }
            }
        });

        document.getElementById('clear-all').addEventListener('click', () => {
            moments = [];
            particles = [];
            autoGenerating = false;
            document.getElementById('auto-generate').textContent = 'AUTO GENERATE';
        });

        for (let i = 0; i < 50; i++) {
            const p = new Particle();
            particles.push(p);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
